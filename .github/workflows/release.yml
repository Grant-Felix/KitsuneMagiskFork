name: Release Kitsune Magisk

# 打包并发布 APK（release + debug + stub）到 GitHub Release。
# 触发：① 推送 tag(v*) ② Actions → 手动 workflow_dispatch
#
# 手动触发的典型用法（用 v27.2-kitsune-4 的源码 + 诚实版本号打包）：
#   source_ref:   v27.2-kitsune-4
#   tag:          v27.2-kitsune-4-selfbuild   （留空则用 source_ref 名）
#   version:      v27.2-kitsune-4
#   version_code: 27002
#
# 说明：老 tag（v27.2-kitsune-4 及更早）里没有 config.prop / TestKey-2024.jks，
# 工作流会自动从默认分支取这两个文件，从而产出与官方镜像同样签名(TestKey-2024)的 APK。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: '要编译的源码 ref（分支或 tag，如 v27.2-kitsune-4；留空=当前 ref）'
        required: false
      tag:
        description: '发布 tag（留空=source_ref/当前 ref 名；不存在会创建）'
        required: false
      version:
        description: '覆盖 config.prop 的 version（如 v27.2-kitsune-4）'
        required: false
      version_code:
        description: '覆盖 gradle.properties 的 magisk.versionCode（如 27002）'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      SCCACHE_DIRECT: false
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          submodules: "recursive"
          fetch-depth: 0

      - name: Fetch config.prop / keystore from default branch if missing
        run: |
          set -e
          DEF="${{ github.event.repository.default_branch }}"
          git fetch --depth=1 origin "$DEF" || true
          if [ ! -f config.prop ]; then
            echo "seeding config.prop from $DEF"
            git show "origin/$DEF:config.prop" > config.prop
          fi
          if [ ! -f TestKey-2024.jks ]; then
            echo "seeding TestKey-2024.jks from $DEF"
            git show "origin/$DEF:TestKey-2024.jks" > TestKey-2024.jks
          fi
          ls -l config.prop TestKey-2024.jks

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Override version (optional)
        if: ${{ github.event.inputs.version != '' || github.event.inputs.version_code != '' }}
        run: |
          set -e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            if grep -q '^version=' config.prop; then
              sed -i "s|^version=.*|version=${{ github.event.inputs.version }}|" config.prop
            else
              printf 'version=${{ github.event.inputs.version }}\n' >> config.prop
            fi
          fi
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            sed -i "s|^magisk.versionCode=.*|magisk.versionCode=${{ github.event.inputs.version_code }}|" gradle.properties
          fi
          echo '--- config.prop'; grep -E '^version=|^keyStore=' config.prop || true
          echo '--- gradle.properties'; grep -E '^magisk\.' gradle.properties || true

      - name: Build release
        run: ./build.py -vr all

      - name: Build debug
        run: ./build.py -v all

      - name: Stop gradle daemon
        run: ./gradlew --stop

      - name: Determine version and tag
        id: ver
        run: |
          set -e
          VERSION="$(sed -n 's/^version=//p' config.prop | head -1)"
          [ -n "$VERSION" ] || VERSION="$(git rev-parse --short=8 HEAD)"
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ github.event.inputs.source_ref }}"
          [ -n "$TAG" ] || TAG="${{ github.ref_name }}"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION tag=$TAG"
          ls -l out

      - name: Prepare assets
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          cd out
          mv -f app-release.apk "Kitsune.Magisk.release.$V.apk"
          mv -f app-debug.apk   "Kitsune.Magisk.debug.$V.apk"
          ls -l

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="Kitsune Magisk ${{ steps.ver.outputs.version }}"
          FILES="out/Kitsune.Magisk.release.*.apk out/Kitsune.Magisk.debug.*.apk out/stub-release.apk out/stub-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" --target "${{ github.event.inputs.source_ref || github.ref_name }}" --title "$TITLE" --generate-notes $FILES
          fi
          gh release view "$TAG" --json name,tagName,assets --jq '{name, tagName, assets: [.assets[] | {name, size}]}'
